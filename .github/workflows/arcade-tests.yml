name: Arcade checks
on: [pull_request]
permissions:
  contents: read
concurrency:
  group: arcade-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: python -m pip install --disable-pip-version-check -r tools/requirements.txt
      - run: python tools/build_previews.py
  rewards-and-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium webkit
      - name: Set external artifact folder
        run: echo "FORKADE_ARTIFACTS=$RUNNER_TEMP/forkade-artifacts" >> "$GITHUB_ENV"
      - run: npm run test:suite
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forkade-browser-proof
          path: ${{ runner.temp }}/forkade-artifacts
          retention-days: 7
