name: Arcade checks
on: [pull_request]
permissions:
  contents: read
concurrency:
  group: arcade-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Isolated attack suite and real Redis Lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y redis-server
          redis-server --port 6380 --bind 127.0.0.1 --save "" --appendonly no --daemonize yes
          SECURITY_REDIS=1 node tests/security.cjs
      - name: Scan full history without disclosing matches
        run: |
          scan=$(mktemp -d)
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$scan/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt -o "$scan/checksums.txt"
          (cd "$scan" && grep ' gitleaks_8.30.1_linux_x64.tar.gz$' checksums.txt | sha256sum -c - && tar -xzf gitleaks_8.30.1_linux_x64.tar.gz)
          "$scan/gitleaks" git --redact --log-opts="--all" --no-banner .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: python -m pip install --disable-pip-version-check -r tools/requirements.txt
      - run: python tools/build_previews.py
  rewards-and-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium webkit
      - name: Set external artifact folder
        run: echo "FORKADE_ARTIFACTS=$RUNNER_TEMP/forkade-artifacts" >> "$GITHUB_ENV"
      - name: Capture before screenshots from PR base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          baseline=$(mktemp -d)
          git archive "$BASE_SHA" | tar -x -C "$baseline"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$baseline/node_modules"
          cp tests/style.cjs "$baseline/tests/style.cjs"
          cd "$baseline"
          STYLE_BASELINE=1 STYLE_PHASE=before node tests/style.cjs
      - run: npm run test:suite
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forkade-browser-proof
          path: ${{ runner.temp }}/forkade-artifacts
          retention-days: 7
