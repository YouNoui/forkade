name: Arcade checks
on: [pull_request]
permissions:
  contents: read
concurrency:
  group: arcade-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --audit-level=high
  rewards-and-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FORKADE_ARTIFACTS: ${{ runner.temp }}/forkade-artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:suite
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forkade-browser-proof
          path: ${{ runner.temp }}/forkade-artifacts
          retention-days: 7
