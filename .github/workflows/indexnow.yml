name: Notify search engines after production deploy
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  statuses: read
jobs:
  indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for successful production deployment of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-production.mjs
      - name: Notify IndexNow (best effort)
        continue-on-error: true
        run: node scripts/indexnow.mjs
