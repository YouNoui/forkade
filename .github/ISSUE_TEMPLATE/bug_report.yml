name: Bug report
description: Tell us what went wrong while playing.
title: "[Bug] "
body:
  - type: input
    id: game
    attributes:
      label: Game and page
      placeholder: Sky Hop at /skyhop
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected result, and actual result
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Browser, device, screen orientation, and web or offline build
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot or error (optional)
      description: Remove names, private information, player IDs and secret stats keys first.
